<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>New messages</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{height:100%;display:flex;align-items:center;justify-content:center;background:#0d0d10}
.phone{position:relative;height:min(94vh,960px);aspect-ratio:9/16;container-type:inline-size;overflow:hidden;border-radius:28px;background:#000;user-select:none;-webkit-user-select:none}
@media (max-width:760px){.phone{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0}}
.screen{position:absolute;inset:0;overflow:hidden}
.sb{position:absolute;top:0;left:0;right:0;height:10cqw;display:flex;align-items:center;justify-content:space-between;padding:0 7cqw;font-size:3.9cqw;font-weight:600;color:#fff;z-index:10;pointer-events:none}
.sb .t{opacity:0;transition:opacity .3s}
body.inchat .sb .t{opacity:1}
.sb .ic{display:flex;gap:1.4cqw;align-items:center}
.sb svg{height:3.2cqw;width:auto;fill:#fff}
.wall{position:absolute;inset:-5%;background:radial-gradient(120% 70% at 20% 10%,#5b3a8c 0%,transparent 60%),radial-gradient(100% 70% at 90% 90%,#b0396b 0%,transparent 60%),linear-gradient(160deg,#1b1240,#3a1530 60%,#120b1c)}
.lock{transition:opacity .45s,filter .45s,transform .5s;cursor:pointer}
.lock.away{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none}
.lockicon{position:absolute;top:11cqw;left:50%;width:5cqw;margin-left:-2.5cqw;color:#fff;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.lockicon svg{width:100%;height:auto;display:block;overflow:visible}
.lockicon .shackle{transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.lockicon.open{transform:scale(1.15)}
.lockicon.open .shackle{transform:translateY(-4px)}
.date{position:absolute;top:19.5cqw;width:100%;text-align:center;font-size:5cqw;font-weight:600;color:rgba(255,255,255,.9)}
.clock{position:absolute;top:24cqw;width:100%;text-align:center;font-size:23cqw;font-weight:700;letter-spacing:-.02em;line-height:1;color:rgba(255,255,255,.95)}
.notifs{position:absolute;top:56cqw;left:3.5cqw;right:3.5cqw;bottom:30cqw;overflow:hidden;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.nw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.9,.25,1)}
.nw.in{grid-template-rows:1fr}
.nin{min-height:0;overflow:hidden}
.n{margin-bottom:2.2cqw;display:flex;gap:3cqw;align-items:center;padding:3.2cqw 3.6cqw;border-radius:5.5cqw;background:rgba(40,40,48,.42);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);color:#fff;transform:translateY(-40%) scale(.92);opacity:0;transition:transform .55s cubic-bezier(.2,1.2,.3,1),opacity .35s;cursor:pointer}
.nw.in .n{transform:none;opacity:1}
.nw.in .n:active,.nw.in .n.press{transform:scale(.95);transition:transform .15s}
.nw.in .n.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03);box-shadow:0 0 0 .8cqw rgba(255,255,255,.25)}}
.avw{position:relative;flex:none;width:10.5cqw;height:10.5cqw}
.av{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;overflow:hidden}
.badge{position:absolute;right:-.8cqw;bottom:-.8cqw;width:4.6cqw;height:4.6cqw;border-radius:1.3cqw;background:linear-gradient(#5ff777,#12c13a);display:grid;place-items:center}
.badge svg{width:70%;height:70%}
.nb{flex:1;min-width:0}
.nt{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;font-size:3.75cqw}
.nt b{font-weight:600}
.nt span{font-size:3.3cqw;color:rgba(255,255,255,.6);flex:none}
.nx{font-size:3.75cqw;line-height:1.3;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:absolute;bottom:24cqw;width:100%;text-align:center;color:rgba(255,255,255,.85);font-size:3.8cqw;font-weight:500;opacity:0;transition:opacity .5s}
.hint.show{opacity:1;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.lbtns{position:absolute;bottom:9cqw;left:11cqw;right:11cqw;display:flex;justify-content:space-between}
.lb{width:12.5cqw;height:12.5cqw;border-radius:50%;background:rgba(30,30,40,.45);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center}
.lb svg{width:45%;height:45%;fill:#fff}
.home{position:absolute;bottom:2.2cqw;left:50%;width:36cqw;margin-left:-18cqw;height:1.3cqw;border-radius:1cqw;background:#fff;z-index:5;pointer-events:none}
.chat{background:#000;opacity:0;transform:scale(.25);border-radius:8cqw;transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .3s,border-radius .55s;display:flex;flex-direction:column;pointer-events:none}
.chat.show{opacity:1;transform:none;border-radius:0;pointer-events:auto}
.chead{padding:11cqw 4cqw 3cqw;display:flex;flex-direction:column;align-items:center;gap:1.2cqw;background:rgba(22,22,24,.95);border-bottom:1px solid rgba(255,255,255,.08);position:relative;flex:none}
.back{position:absolute;left:3.5cqw;top:15cqw;color:#0a84ff;font-size:10cqw;line-height:1;font-weight:300}
.chead .av{width:13cqw;height:13cqw}
.cname{font-size:3.6cqw;color:#fff;font-weight:500}
.cstat{font-size:3cqw;color:#30d158;margin-top:-.6cqw}
.msgs{flex:1;overflow:hidden;padding:4cqw 3.5cqw;display:flex;flex-direction:column;justify-content:flex-end;gap:1.3cqw}
.stamp{text-align:center;font-size:3cqw;color:#8e8e93;margin-bottom:2cqw}
.b{max-width:74%;align-self:flex-start;background:#26262a;color:#fff;font-size:4.2cqw;line-height:1.3;padding:2.4cqw 3.6cqw;border-radius:5cqw;border-bottom-left-radius:1.5cqw;animation:pop .35s cubic-bezier(.2,1.3,.3,1) both;transform-origin:left bottom;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.b.ph{padding:0;overflow:hidden;width:60%;border-radius:5cqw}
.b.ph .pi{width:100%;aspect-ratio:3/4;background-size:cover;background-position:center 30%;filter:blur(22px) brightness(.85);transform:scale(1.2);transition:filter 1.2s ease,transform 1.2s ease}
.b.ph.clear .pi{filter:none;transform:none}
.typing{display:flex;gap:1.1cqw;padding:3.3cqw 3.8cqw}
.typing i{width:1.9cqw;height:1.9cqw;border-radius:50%;background:#8e8e93;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-.8cqw)}}
.cinput{padding:2.5cqw 3.5cqw 8cqw;display:flex;flex-direction:column;gap:2.5cqw;flex:none}
.replies{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:flex-end;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s,opacity .4s}
.replies.show{max-height:40cqw;opacity:1}
.rep{background:#0a84ff;color:#fff;border:0;font:inherit;font-size:4cqw;padding:2.6cqw 4.2cqw;border-radius:5cqw;cursor:pointer}
.rep.main{animation:pulse 1.4s ease-in-out infinite}
.irow{display:flex;gap:2.5cqw;align-items:center;cursor:pointer}
.plus{width:8.5cqw;height:8.5cqw;border-radius:50%;background:#26262a;color:#aaa;display:grid;place-items:center;font-size:5.5cqw;line-height:1}
.field{flex:1;height:8.5cqw;border:1px solid #3a3a3e;border-radius:5cqw;color:#666;font-size:3.8cqw;display:flex;align-items:center;padding:0 3.5cqw}

.b.out{align-self:flex-end;background:#0a84ff;border-bottom-left-radius:5cqw;border-bottom-right-radius:1.5cqw;transform-origin:right bottom}
.b.exp{background:#1c1c1e;color:#8e8e93;font-style:italic}
.b.secret{padding:0;overflow:hidden;width:60%;border-radius:5cqw;position:relative;cursor:pointer}
.b.secret .pi{width:100%;aspect-ratio:3/4;background-size:cover;background-position:center 30%;filter:blur(26px) brightness(.6);transform:scale(1.3)}
.b.secret .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;color:#fff;font-size:3.6cqw;text-align:center;padding:0 4cqw}
.b.secret .fire{width:15cqw;height:15cqw;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:7.5cqw}
.b.secret .tm{font-size:3.2cqw;background:rgba(0,0,0,.45);padding:.8cqw 2.4cqw;border-radius:3cqw}
.b.secret.pulse .fire{animation:pulse 1.4s ease-in-out infinite}
.irow input{flex:1;min-width:0;height:9cqw;border:1px solid #3a3a3e;border-radius:5cqw;background:transparent;color:#fff;font:inherit;font-size:max(16px,3.8cqw);padding:0 3.5cqw;outline:none}
.irow input::placeholder{color:#666}
.irow.locked{pointer-events:none;opacity:.55}
.irow.glow input{border-color:#0a84ff;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 .8cqw rgba(10,132,255,.25)}}
.send{flex:none;width:9cqw;height:9cqw;border-radius:50%;background:#0a84ff;border:0;display:grid;place-items:center;cursor:pointer}
.send svg{width:55%;height:55%}
.rep.alt{background:#26262a}
.viewer{position:absolute;inset:0;background:#000;z-index:30;display:none}
.viewer.show{display:block;animation:fin .25s}
@keyframes fin{from{opacity:0}}
.viewer .vi{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center}
.ring{position:absolute;top:12cqw;right:5cqw;width:13cqw;height:13cqw;display:grid;place-items:center;color:#fff;font-weight:600;font-size:4.2cqw}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:rgba(0,0,0,.45);stroke:#fff;stroke-width:3;stroke-linecap:round}
.ring span{position:relative}
.vhint{position:absolute;bottom:12cqw;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:3.6cqw;text-shadow:0 1px 4px #000}
</style>
</head>

    </div>
  </div>
  <div class="screen chat" id="chat">

    <div class="msgs" id="msgs"></div>

    </div>
  </div>
  <div class="viewer" id="viewer"><div class="vi" id="vi"></div><div class="ring"><svg viewBox="0 0 40 40"><circle id="ringC" cx="20" cy="20" r="17"/></svg><span id="ringN"></span></div><div class="vhint">Photo disappears when the timer ends</div></div>
  <div class="home"></div>
</div></div>

const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BADGE='<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 4C7 4 3 7.4 3 11.5c0 2.3 1.2 4.3 3.1 5.7L5.5 20l3.4-1.8c1 .3 2 .4 3.1.4 5 0 9-3.4 9-7.5S17 4 12 4z"/></svg>';
const now=new Date(),hm=now.toTimeString().slice(0,5);
$('#clockEl').textContent=hm;$('#sbTime').textContent=hm;
$('#dateEl').textContent=now.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
const pic=i=>'url("'+EMB.pics[i]+'")';

let ac=null,opened=false,stage=0,lastCard=null,lastGirl=NOTIFS[NOTIFS.length-1][0],girl=0;
function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function tone(f,d,dur,v){if(!ac||ac.state!=='running')return;const t=ac.currentTime+d,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05)}
const ding=()=>{tone(1568,0,.3,.1);tone(2093,.09,.35,.1)};
const whoosh=()=>{tone(880,0,.12,.08);tone(1320,.06,.15,.06)};

function go(){
  let u=OFFER_URL;
  try{const x=new URL(OFFER_URL,location.href);new URLSearchParams(location.search).forEach((v,k)=>x.searchParams.set(k,v));u=x.toString()}catch(e){}
  location.href=u;
}

/* ---------- lock screen ---------- */
function addNotif([gi,text]){
  const w=el('div','nw'),inner=el('div','nin'),card=el('div','n'),aw=el('div','avw'),a=el('div','av');
  a.style.backgroundImage='url("'+EMB.av[gi]+'")';aw.append(a,el('div','badge',BADGE));
  card.append(aw,el('div','nb','<div class="nt"><b>'+esc(GIRLS[gi].name)+'</b><span>now</span></div><div class="nx">'+esc(text)+'</div>'));
  card.onclick=e=>{e.stopPropagation();openChat(card,gi)};
  inner.append(card);w.append(inner);$('#notifs').prepend(w);
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('in')));
  try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}
  return card;
}
async function intro(){
  await sleep(700);
  for(let i=0;i<NOTIFS.length;i++){
    if(opened)return;
    lastCard=addNotif(NOTIFS[i]);lastGirl=NOTIFS[i][0];
    await sleep(i<2?1000:600);
  }
  if(opened)return;
  await sleep(500);lastCard.classList.add('pulse');$('#hint').classList.add('show');
}
$('#lock').onclick=()=>{if(lastCard)openChat(lastCard,lastGirl)};

/* ---------- chat ---------- */
const isPhoto=l=>/^\[photo\]$/i.test(l);
function scrollEnd(){}
async function typing(ms){const ty=el('div','b typing','<i></i><i></i><i></i>');$('#msgs').append(ty);await sleep(ms);ty.remove()}
async function say(lines){
  for(const line of lines){
    const ph=isPhoto(line);
    await typing(ph?1200:Math.min(1900,650+line.length*28));
    let b;
    if(ph){b=el('div','b ph');const pi=el('div','pi');pi.style.backgroundImage=pic(GIRLS[girl].photo);b.append(pi);setTimeout(()=>b.classList.add('clear'),1200)}
    else{b=el('div','b');b.textContent=line}
    $('#msgs').append(b);ding();
    await sleep(ph?1900:850);
  }
}
function setReplies(list,cls,fn){
  const rp=$('#replies');rp.innerHTML='';
  list.forEach((t,i)=>{const btn=el('button','rep '+(cls(i)||''));btn.type='button';btn.textContent=t;btn.onclick=()=>fn(t);rp.append(btn)});
  rp.classList.toggle('show',list.length>0);
}

async function openChat(card,gi){
  if(opened)return;opened=true;girl=gi;audio();
  card.classList.remove('pulse');card.classList.add('press');
  const pr=$('#phone').getBoundingClientRect(),r=card.getBoundingClientRect();
  await sleep(160);card.classList.remove('press');
  $('#lockIcon').classList.add('open');tone(2600,0,.04,.12);
  await sleep(500);
  const chat=$('#chat');chat.style.transformOrigin=(r.left-pr.left+r.width/2)+'px '+(r.top-pr.top+r.height/2)+'px';
  $('#chAv').style.backgroundImage='url("'+EMB.av[gi]+'")';$('#chName').textContent=GIRLS[gi].name;
  $('#msgs').innerHTML='<div class="stamp">Today '+hm+'</div>';
  document.body.classList.add('inchat');$('#lock').classList.add('away');chat.classList.add('show');
  await sleep(800);
  await say(CHAT1);
  stage=1;
  const ir=$('#irow');ir.classList.remove('locked');ir.classList.add('glow');$('#inp').placeholder='Write her something…';
  setReplies(QUICK,()=>'alt',userSend);
}

$('#irow').onsubmit=e=>{e.preventDefault();if(stage===3){go();return}const v=$('#inp').value.trim();if(v)userSend(v)};
$('#inp').addEventListener('focus',()=>{if(stage===3)go()});

async function userSend(text){
  if(stage!==1)return;stage=2;
  const inp=$('#inp');inp.value='';inp.blur();
  const ir=$('#irow');ir.classList.add('locked');ir.classList.remove('glow');setReplies([],()=>'',()=>{});
  const b=el('div','b out');b.textContent=text;$('#msgs').append(b);whoosh();
  await sleep(900);
  await say(CHAT2);
  await typing(1300);
  sendSecret();
}

function sendSecret(){
  const b=el('div','b secret pulse');
  const pi=el('div','pi');pi.style.backgroundImage=pic(GIRLS[girl].secret);
  b.append(pi,el('div','ov','<div class="fire">🔥</div><div>Tap to view</div><div class="tm">⏱ '+SECRET_SECONDS+'s</div>'));
  b.onclick=()=>viewSecret(b);
  $('#msgs').append(b);ding();
}

let viewing=false;
async function viewSecret(bubble){
  if(viewing||bubble.dataset.done)return;viewing=true;bubble.dataset.done=1;
  const v=$('#viewer'),c=$('#ringC'),n=$('#ringN'),L=2*Math.PI*17;
  $('#vi').style.backgroundImage=pic(GIRLS[girl].secret);
  c.style.strokeDasharray=L;c.style.strokeDashoffset=0;c.style.transition='none';
  v.classList.add('show');
  void c.getBoundingClientRect();
  c.style.transition='stroke-dashoffset '+SECRET_SECONDS+'s linear';c.style.strokeDashoffset=L;
  for(let s=SECRET_SECONDS;s>0;s--){n.textContent=s;await sleep(1000)}
  v.classList.remove('show');
  bubble.className='b exp';bubble.onclick=null;bubble.textContent='🔥 Photo expired';
  await sleep(1000);
  await say(CHAT3);
  stage=3;
  const ir=$('#irow');ir.classList.remove('locked');
  setReplies(FINAL,i=>i===FINAL.length-1?'main':'',go);
  $('#msgs').onclick=go;
}

intro();
</script>
